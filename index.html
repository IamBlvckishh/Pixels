<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixels Studio</title>
  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #000000;
      --border-color: #e5e5e5;
      --panel-bg: #f9f9f9;
      --accent-color: #ff0055;
      --muted-text: #8c8c8c;
      --canvas-bg: #f0f0f0;
    }

    /* Alternate Themes */
    body.theme-dark {
      --bg-color: #0a0a0a;
      --text-color: #ffffff;
      --border-color: #262626;
      --panel-bg: #121212;
      --accent-color: #ff0055;
      --muted-text: #666666;
      --canvas-bg: #050505;
    }

    body.theme-cyberpunk {
      --bg-color: #1a0033;
      --text-color: #00ffff;
      --border-color: #ff00aa;
      --panel-bg: #0d001a;
      --accent-color: #ffff00;
      --muted-text: #8800ff;
      --canvas-bg: #05000a;
    }

    body.theme-matrix {
      --bg-color: #000c00;
      --text-color: #00ff00;
      --border-color: #003300;
      --panel-bg: #000500;
      --accent-color: #33ff33;
      --muted-text: #005500;
      --canvas-bg: #000200;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      letter-spacing: -0.01em;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    header {
      height: 70px;
      padding: 0 32px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      background: var(--panel-bg);
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .studio-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .collection-status {
      font-size: 11px;
      font-weight: 600;
      font-family: monospace;
      color: var(--accent-color);
      letter-spacing: 0.1em;
      background: rgba(255, 0, 85, 0.08);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      justify-self: center;
    }

    .header-right {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .network-status-box {
      font-family: monospace;
      font-size: 11px;
      font-weight: 600;
      padding: 10px 14px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--muted-text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .network-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted-text);
    }

    .network-dot.active {
      background: #00ffcc;
    }

    .network-dot.error {
      background: var(--accent-color);
    }

    button,
    select,
    .text-field-input {
      background: var(--bg-color);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .text-field-input {
      cursor: text;
      outline: none;
    }

    .text-field-input:focus {
      border-color: var(--muted-text);
    }

    button:hover {
      background: var(--text-color);
      color: var(--bg-color);
      border-color: var(--text-color);
    }

    select {
      width: 100%;
      background: var(--panel-bg);
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='gray' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 40px;
    }

    select option {
      background: var(--panel-bg);
      color: var(--text-color);
    }

    button:disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    button:disabled:hover {
      background: var(--bg-color);
      color: var(--text-color);
      border-color: var(--border-color);
    }

    .studio-layout {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 20px;
      height: 100%;
      overflow-y: auto;
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
    }

    .canvas-area {
      background: var(--canvas-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      overflow: hidden;
      position: relative;
      border-right: 1px solid var(--border-color);
      padding: 20px;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted-text);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .trait-group {
      border: 1px solid var(--border-color);
      padding: 12px;
      border-radius: 8px;
      background: var(--bg-color);
    }

    .grid-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .color-swatch {
      aspect-ratio: 1/1;
      border: 2px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .color-swatch:hover {
      transform: scale(1.05);
    }

    .color-swatch.active {
      border-color: var(--text-color);
      transform: scale(0.95);
    }

    .art-palette-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .color-wheel-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
      border-top: 1px dashed var(--border-color);
      padding-top: 10px;
    }

    .color-wheel-input {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      width: 32px;
      height: 32px;
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 50%;
      cursor: pointer;
      padding: 0;
      overflow: hidden;
    }

    .color-wheel-input::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-wheel-input::-webkit-color-swatch {
      border: none;
      border-radius: 50%;
    }

    .color-wheel-input::-moz-color-swatch {
      border: none;
      border-radius: 50%;
    }

    .color-wheel-label {
      font-size: 11px;
      font-family: monospace;
      color: var(--text-color);
    }

    .pixel-container {
      width: 100%;
      max-width: 380px;
      aspect-ratio: 1/1;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      display: grid;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.05);
    }

    body.theme-dark .pixel-container,
    body.theme-cyberpunk .pixel-container,
    body.theme-matrix .pixel-container {
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.8);
    }

    .pixel-cell {
      border: 0.5px solid rgba(0, 0, 0, 0.03);
      cursor: crosshair;
      aspect-ratio: 1/1;
    }

    body.theme-dark .pixel-cell,
    body.theme-cyberpunk .pixel-cell,
    body.theme-matrix .pixel-cell {
      border-color: rgba(255, 255, 255, 0.02);
    }

    .history-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 380px;
      justify-content: center;
    }

    .history-controls button {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: var(--bg-color);
    }

    .input-box,
    .source-box {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 12px;
      font-size: 11px;
      border-radius: 8px;
      color: var(--text-color);
      font-family: monospace;
      word-break: break-all;
    }

    .input-box {
      width: 100%;
      height: 80px;
      resize: none;
      outline: none;
    }

    .input-box:focus {
      border-color: var(--muted-text);
    }

    .source-box {
      flex: 1;
      overflow-y: auto;
      user-select: all;
      min-height: 120px;
    }

    .action-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-mint {
      background: var(--text-color);
      color: var(--bg-color);
      font-weight: 600;
      padding: 12px;
      font-size: 12px;
      border: none;
      border-radius: 6px;
    }

    .btn-mint:hover {
      background: var(--accent-color);
      color: #ffffff;
    }

    .btn-mint:disabled {
      background: var(--panel-bg);
      color: var(--muted-text);
      border: 1px solid var(--border-color);
    }

    .tx-status {
      padding: 12px;
      border: 1px solid rgba(255, 0, 85, 0.3);
      background: rgba(255, 0, 85, 0.05);
      border-radius: 8px;
      text-align: center;
    }

    .tx-status a {
      color: var(--accent-color);
      font-size: 11px;
      font-family: monospace;
      text-decoration: none;
      display: block;
      margin-top: 4px;
    }

    .tx-status a:hover {
      text-decoration: underline;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border-color);
      border-radius: 3px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
</head>

<body>
  <header>
    <div class="header-left">
      <div class="studio-title">Pixels Studio</div>
      <button id="themeBtn" onclick="toggleTheme()">Theme: Light</button>
    </div>
    <div class="collection-status" id="mintTracker">MINTED: 0 / 250</div>
    <div class="header-right">
      <div class="network-status-box" id="networkStatusBox">
        <div class="network-dot" id="networkDot"></div>
        <span id="networkName">Disconnected</span>
      </div>
      <button id="walletBtn" onclick="handleWalletAction()">
        Connect Wallet
      </button>
    </div>
  </header>

  <div class="studio-layout">
    <section class="panel">
      <button onclick="resetToCurrentBase()" style="
            border-style: dashed;
            width: 100%;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 4px;
          ">
        Clear Settings
      </button>

      <div class="trait-group">
        <div class="section-title">1. Base Archetype</div>
        <div class="grid-options">
          <button onclick="setBaseModel('none')" id="base-none" style="grid-column: span 2">
            None (Blank Canvas)
          </button>
          <button onclick="setBaseModel('human')" id="base-human">
            Human
          </button>
          <button onclick="setBaseModel('cat')" id="base-cat">Cat</button>
          <button onclick="setBaseModel('frog')" id="base-frog">Frog</button>
          <button onclick="setBaseModel('dog')" id="base-dog">Dog</button>
          <button onclick="setBaseModel('robot')" id="base-robot" style="grid-column: span 2">
            Robot
          </button>
        </div>
      </div>

      <div class="trait-group">
        <div class="section-title">2. Skin Palette</div>
        <div class="palette-grid" id="skinPalette"></div>
      </div>

      <div class="trait-group">
        <div class="section-title">3. Add-on Traits</div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <div>
            <label class="section-title" style="font-size: 10px; display: block; margin-bottom: 4px">Headwear</label>
            <select id="traitHead" onchange="applyTraits()">
              <option value="none">None</option>
              <option value="cyber_halo">Cyber Halo</option>
              <option value="beanie">Night Beanie</option>
              <option value="crown">Gold Crown</option>
            </select>
          </div>
          <div>
            <label class="section-title" style="font-size: 10px; display: block; margin-bottom: 4px">Eyes & Face</label>
            <select id="traitEyes" onchange="applyTraits()">
              <option value="none">None</option>
              <option value="laser_beams">Laser Beams</option>
              <option value="vibe_shades">Vibe Shades</option>
              <option value="cyborg_eye">Cyborg Eye</option>
              <option value="neon_shades">Neon Shades</option>
            </select>
          </div>
          <div>
            <label class="section-title" style="font-size: 10px; display: block; margin-bottom: 4px">Mouth &
              Accessories</label>
            <select id="traitMouth" onchange="applyTraits()">
              <option value="none">None</option>
              <option value="bubblegum">Bubblegum</option>
              <option value="cigarette">Cigarette</option>
            </select>
          </div>
        </div>
      </div>

      <div class="trait-group">
        <div class="section-title">Paint Tool Swatch</div>
        <div class="art-palette-container">
          <div class="palette-grid" id="artPalette"></div>
          <div class="color-wheel-wrapper">
            <input type="color" id="colorWheel" class="color-wheel-input" value="#000000"
              oninput="handleColorWheelInput(this.value)">
            <span id="colorWheelLabel" class="color-wheel-label">#000000</span>
          </div>
        </div>
      </div>

      <div class="action-container" style="margin-top: auto">
        <button id="mintBtn" onclick="deployOnChain()" class="btn-mint" disabled>
          Mint Reserve Slot
        </button>
      </div>
    </section>

    <section class="canvas-area">
      <div class="pixel-container" id="pixelContainer"></div>
      <div class="history-controls">
        <button id="undoBtn" onclick="undo()" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7v6h6"></path>
            <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path>
          </svg>
          Undo
        </button>
        <button id="redoBtn" onclick="redo()" disabled>
          Redo
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 7v6h-6"></path>
            <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path>
          </svg>
        </button>
      </div>
    </section>

    <section class="panel">
      <div>
        <div class="section-title">Inject Base Matrix / Custom Trait</div>
        <div style="
              display: flex;
              flex-direction: column;
              gap: 8px;
              margin-bottom: 8px;
            ">
          <input type="text" id="customTraitName" class="text-field-input"
            placeholder="Name your custom trait (e.g. Neon Shades)"
            style="width: 100%; font-size: 11px; padding: 8px 12px" />
          <select id="customTraitTargetSlot" class="text-field-input" style="
                width: 100%;
                font-size: 11px;
                padding: 8px 12px;
                height: auto;
              ">
            <option value="Eyes">Assign to: Eyes & Face Menu</option>
            <option value="Head">Assign to: Headwear Menu</option>
            <option value="Mouth">Assign to: Mouth & Accessories Menu</option>
          </select>
        </div>
        <textarea id="importBox" class="input-box"
          placeholder="Paste custom string layout elements or raw SVG rect paths here..."
          oninput="handleCustomSvgInjection()"></textarea>
      </div>

      <div style="flex: 1; display: flex; flex-direction: column">
        <div class="section-title">Compiled Source Engine Target</div>
        <div class="source-box" id="sourceBox">&lt;svg&gt;&lt;/svg&gt;</div>
      </div>

      <div class="tx-status" id="txStatus" style="display: none">
        <span style="font-size: 12px; font-weight: 600">Asset Anchored Onchain</span>
        <a id="txLink" href="#" target="_blank">View Transaction</a>
      </div>
    </section>
  </div>

    function init() {
      renderSwatches("skinPalette", SKIN_COLORS, (color) => {
        currentSkinColor = color;
        applyTraits();
      });
      renderSwatches("artPalette", ART_COLORS, (color) => {
        activeColor = color;
        // Reset color wheel visual sync when preset swatch is selected
        if (color !== "transparent") {
          document.getElementById("colorWheel").value = color;
          document.getElementById("colorWheelLabel").innerText = color.toUpperCase();
        }
      });
      setBaseModel("human");

      document.body.onmousedown = () => {
        isDrawing = true;
      };
      document.body.onmouseup = () => {
        isDrawing = false;
      };
      updateSupplyCounter();

      if (supplyPollInterval) clearInterval(supplyPollInterval);
      supplyPollInterval = setInterval(updateSupplyCounter, 4000);

      if (window.ethereum) {
        window.ethereum.on("chainChanged", handleChainChanged);
        window.ethereum.on("accountsChanged", handleAccountsChanged);
      }

    function toggleTheme() {
      document.body.classList.remove(`theme-${THEMES[currentThemeIdx]}`);
      currentThemeIdx = (currentThemeIdx + 1) % THEMES.length;
      if (THEMES[currentThemeIdx] !== "light") {
        document.body.classList.add(`theme-${THEMES[currentThemeIdx]}`);
      }
      document.getElementById("themeBtn").innerText = `Theme: ${THEMES[currentThemeIdx].charAt(0).toUpperCase() +
        THEMES[currentThemeIdx].slice(1)
        }`;
    }

    function saveHistoryState() {
      undoStack.push([...customOverlay]);
      redoStack = [];
      updateHistoryButtons();
    }

    function undo() {
      if (undoStack.length === 0) return;
      redoStack.push([...customOverlay]);
      customOverlay = undoStack.pop();
      updateHistoryButtons();
      syncCanvasUI();
    }

    function redo() {
      if (redoStack.length === 0) return;
      undoStack.push([...customOverlay]);
      customOverlay = redoStack.pop();
      updateHistoryButtons();
      syncCanvasUI();
    }

    function updateHistoryButtons() {
      document.getElementById("undoBtn").disabled = undoStack.length === 0;
      document.getElementById("redoBtn").disabled = redoStack.length === 0;
    }

    function renderSwatches(containerId, dataArray, selectionCallback) {
      const container = document.getElementById(containerId);
      container.innerHTML = "";
      dataArray.forEach((color, idx) => {
        const swatch = document.createElement("div");
        swatch.className = `color-swatch ${idx === 0 && containerId === "artPalette" ? "active" : ""
          }`;
        swatch.style.backgroundColor =
          color === "transparent" ? "#222" : color;
        if (color === "transparent") swatch.style.borderStyle = "dashed";

        swatch.onclick = () => {
          container
            .querySelectorAll(".color-swatch")
            .forEach((s) => s.classList.remove("active"));
          swatch.classList.add("active");
          selectionCallback(color);
        };
        container.appendChild(swatch);
      });
    }

    function handleColorWheelInput(color) {
      activeColor = color;
      document.getElementById("colorWheelLabel").innerText = color.toUpperCase();

      // Clear active styling from fixed swatches since custom color wheel overrides them
      document.getElementById("artPalette")
        .querySelectorAll(".color-swatch")
        .forEach((s) => s.classList.remove("active"));
    }

    function setBaseModel(modelKey) {
      currentBase = modelKey;
      ["none", "human", "cat", "frog", "dog", "robot"].forEach((m) => {
        const btn = document.getElementById(`base-${m}`);
        if (btn)
          btn.style =
            m === modelKey
              ? "background:var(--text-color); color:var(--bg-color); border-color:var(--text-color);"
              : "";
      });
      applyTraits();
    }

    function applyTraits() {
      baseGrid = Array(GRID_SIZE * GRID_SIZE).fill("transparent");
      const model = BASE_MODELS[currentBase];

      if (model) {
        let fillTone = currentSkinColor;
        if (currentBase === "frog") fillTone = "#00ffcc";
        if (currentBase === "robot") fillTone = "#e2e8f0";

        model.fill.forEach(([x, y]) => {
          baseGrid[xyToIdx(x, y)] = fillTone;
        });
        model.outline.forEach(([x, y]) => {
          baseGrid[xyToIdx(x, y)] = "#000000";
        });
        Object.keys(model.features).forEach((color) => {
          model.features[color].forEach(([x, y]) => {
            baseGrid[xyToIdx(x, y)] = color;
          });
        });
      }

      ["Head", "Eyes", "Mouth"].forEach((type) => {
        const val = document.getElementById(`trait${type}`).value;
        if (val !== "none" && TRAITS[val]) {
          TRAITS[val].layers.forEach((layer) => {
            layer.cells.forEach(([x, y]) => {
              baseGrid[xyToIdx(x, y)] = layer.color;
            });
          });
        }
      });

      syncCanvasUI();
    }

    function resetToCurrentBase() {
      customOverlay = Array(GRID_SIZE * GRID_SIZE).fill("transparent");
      undoStack = [];
      redoStack = [];
      updateHistoryButtons();
      document.getElementById("importBox").value = "";
      document.getElementById("customTraitName").value = "";
      document.getElementById("traitHead").value = "none";
      document.getElementById("traitEyes").value = "none";
      document.getElementById("traitMouth").value = "none";

      // Reset color brush selection
      activeColor = "#000000";
      document.getElementById("colorWheel").value = "#000000";
      document.getElementById("colorWheelLabel").innerText = "#000000";
      renderSwatches("artPalette", ART_COLORS, (color) => {
        activeColor = color;
        if (color !== "transparent") {
          document.getElementById("colorWheel").value = color;
          document.getElementById("colorWheelLabel").innerText = color.toUpperCase();
        }
      });

      applyTraits();
    }

    function syncCanvasUI() {
      const container = document.getElementById("pixelContainer");
      if (container.children.length === 0) {
        container.style.gridTemplateColumns = `repeat(${GRID_SIZE}, 1fr)`;
        for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
          const cell = document.createElement("div");
          cell.className = "pixel-cell";
          cell.onmouseover = (e) => handlePixelDraw(e, i);
          cell.onmousedown = (e) => {
            saveHistoryState();
            handlePixelDraw(e, i, true);
          };
          container.appendChild(cell);
        }
      }

      for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        const cell = container.children[i];
        cell.style.backgroundColor =
          customOverlay[i] !== "transparent" ? customOverlay[i] : baseGrid[i];
      }
      compileActiveSVG();
    }

    function handlePixelDraw(e, idx, force = false) {
      if (!isDrawing && !force) return;
      customOverlay[idx] = activeColor;
      const cell = document.getElementById("pixelContainer").children[idx];
      cell.style.backgroundColor =
        activeColor !== "transparent" ? activeColor : baseGrid[idx];
      compileActiveSVG();
    }

    function handleCustomSvgInjection() {
      const input = document.getElementById("importBox").value.trim();
      if (!input) return;

      if (input.includes("<rect")) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(
          `<svg>${input}</svg>`,
          "image/svg+xml"
        );
        const rects = doc.querySelectorAll("rect");

        if (rects.length > 0) {
          saveHistoryState();
          const colorLayersMap = {};

          rects.forEach((r) => {
            const x = parseInt(r.getAttribute("x") || "0");
            const y = parseInt(r.getAttribute("y") || "0");
            const fill = (r.getAttribute("fill") || "#000000").toLowerCase();

            if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
              customOverlay[xyToIdx(x, y)] = fill;
              if (!colorLayersMap[fill]) colorLayersMap[fill] = [];
              colorLayersMap[fill].push([x, y]);
            }
          });

          let rawTitleInput = document
            .getElementById("customTraitName")
            .value.trim();
          if (!rawTitleInput) {
            rawTitleInput =
              "Injected Trait " + Math.floor(Math.random() * 1000);
            document.getElementById("customTraitName").value = rawTitleInput;
          }

          const traitKey = rawTitleInput
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "_");
          const selectedSlot = document.getElementById(
            "customTraitTargetSlot"
          ).value;
          const targetSelectMenu = document.getElementById(
            `trait${selectedSlot}`
          );

          const compiledLayers = Object.keys(colorLayersMap).map(
            (colorHex) => {
              return { color: colorHex, cells: colorLayersMap[colorHex] };
            }
          );

          TRAITS[traitKey] = { layers: compiledLayers };

          if (
            !targetSelectMenu.querySelector(`option[value="${traitKey}"]`)
          ) {
            const opt = document.createElement("option");
            opt.value = traitKey;
            opt.innerText = rawTitleInput + " (Injected)";
            targetSelectMenu.appendChild(opt);
          }

          targetSelectMenu.value = traitKey;
          syncCanvasUI();
        }
      }
    }

    function compileActiveSVG() {
      let svgBody = "";
      for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
        const color =
          customOverlay[i] !== "transparent" ? customOverlay[i] : baseGrid[i];
        if (color !== "transparent" && color !== "none") {
          svgBody += `<rect x="${i % GRID_SIZE}" y="${Math.floor(
            i / GRID_SIZE
          )}" width="1" height="1" fill="${color}"/>`;
        }
      }
      svgPreview = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="100%" height="100%"><rect width="16" height="16" fill="none"/>${svgBody}</svg>`;
      document.getElementById("sourceBox").innerText = svgPreview;
    }

    async function updateNetworkUI() {
      const netDot = document.getElementById("networkDot");
      const netName = document.getElementById("networkName");

      if (!window.ethereum || !walletAddress) {
        netDot.className = "network-dot";
        netName.innerText = "Disconnected";
        return;
      }

      try {
        const tempProv = new ethers.BrowserProvider(window.ethereum);
        const network = await tempProv.getNetwork();
        const chainId = network.chainId;

        if (chainId === 1n) {
          netDot.className = "network-dot active";
          netName.innerText = "Mainnet";
          document.getElementById("mintBtn").disabled = false;
        } else if (chainId === 11155111n) {
          netDot.className = "network-dot active";
          netName.innerText = "Sepolia";
          document.getElementById("mintBtn").disabled = false;
        } else {
          netDot.className = "network-dot error";
          netName.innerText = "Wrong Net";
          document.getElementById("mintBtn").disabled = true;
          await requestNetworkSwitch();
        }
      } catch (err) {
        console.error("Failed to recover network context:", err);
      }
    }

    async function requestNetworkSwitch() {
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: "0xaa36a7" }], // Defaults switch try to Sepolia
        });
      } catch (switchError) {
        if (switchError.code === 4902) {
          try {
            await window.ethereum.request({
              method: "wallet_addEthereumChain",
              params: [
                {
                  chainId: "0xaa36a7",
                  chainName: "Sepolia Test Network",
                  rpcUrls: ["https://rpc.sepolia.org"],
                  nativeCurrency: { name: "Sepolia ETH", symbol: "ETH", decimals: 12 },
                  blockExplorerUrls: ["https://sepolia.etherscan.io"],
                },
              ],
            });
          } catch (addError) {
            console.error(addError);
          }
        }
      }
    }

    function handleChainChanged() {
      window.location.reload();
    }

    async function handleAccountsChanged(accounts) {
      if (accounts.length === 0) {
        walletAddress = null;
        signer = null;
        provider = null;
        document.getElementById("walletBtn").innerText = "Connect Wallet";
        document.getElementById("mintBtn").disabled = true;
        updateNetworkUI();
      } else {
        walletAddress = accounts[0];
        provider = new ethers.BrowserProvider(window.ethereum);
        signer = await provider.getSigner();
        document.getElementById("walletBtn").innerText = `${walletAddress.substring(0, 6)}...${walletAddress.substring(38)}`;
        updateNetworkUI();
      }
    }

    async function handleWalletAction() {
      if (walletAddress) {
        walletAddress = null;
        signer = null;
        provider = null;
        document.getElementById("walletBtn").innerText = "Connect Wallet";
        document.getElementById("mintBtn").disabled = true;
        updateNetworkUI();
        return;
      }

      if (window.ethereum) {
        try {
          provider = new ethers.BrowserProvider(window.ethereum);
          const accounts = await provider.send("eth_requestAccounts", []);
          signer = await provider.getSigner();
          walletAddress = accounts[0];

          document.getElementById(
            "walletBtn"
          ).innerText = `${walletAddress.substring(
            0,
            6
          )}...${walletAddress.substring(38)}`;

          await updateNetworkUI();
          updateSupplyCounter();
        } catch (err) {
          console.error("Wallet connectivity error:", err);
        }
      } else {
        alert("Web3 Wallet injector trace absent.");
      }
    }

    async function updateSupplyCounter() {
      if (
        !window.ethereum ||
        CONTRACT_ADDRESS === "0x0000000000000000000000000000000000000000"
      )
        return;
      try {
        const tempProv = new ethers.BrowserProvider(window.ethereum);
        const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, tempProv);
        const network = await tempProv.getNetwork();
        if (network.chainId === 1n || network.chainId === 11155111n) {
          const supply = await contract.totalSupply();
          document.getElementById(
            "mintTracker"
          ).innerText = `MINTED: ${supply.toString()} / 250`;
        }
      } catch (e) {
        console.log("Counter tracking update skipped.");
      }
    }

    async function deployOnChain() {
      if (!signer) return alert("Wallet unlinked.");
      try {
        const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
        const xCoords = [],
          yCoords = [],
          hexColors = [];

        for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
          const color =
            customOverlay[i] !== "transparent"
              ? customOverlay[i]
              : baseGrid[i];
          if (color !== "transparent" && color !== "none") {
            let cleanColorHex = color.replace("#", "").trim();
            if (cleanColorHex.length === 3) {
              cleanColorHex = cleanColorHex
                .split("")
                .map((c) => c + c)
                .join("");
            }
            xCoords.push(i % GRID_SIZE);
            yCoords.push(Math.floor(i / GRID_SIZE));
            hexColors.push(parseInt(cleanColorHex, 16));
          }
        }

        document.getElementById("mintBtn").innerText = "Authorizing...";
        const tx = await contract.mintNFT(xCoords, yCoords, hexColors, {
          value: ethers.parseEther("0.001"),
        });
        document.getElementById("txStatus").style.display = "block";
        document.getElementById(
          "txLink"
        ).href = `https://sepolia.etherscan.io/tx/${tx.hash}`;

        await tx.wait();
        document.getElementById("mintBtn").innerText = "Mint Reserve Slot";
        alert("Pixel design compiled on-chain.");
        updateSupplyCounter();
      } catch (err) {
        console.error(err);
        document.getElementById("mintBtn").innerText = "Mint Reserve Slot";
        alert("Transaction interrupted.");
      }
    }

    window.onload = init;
  </script>
</body>

</html>
